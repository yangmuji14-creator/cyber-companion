name: portable-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade pip
      - name: Cache release wheels
        run: python -m pip download --only-binary=:all: --prefer-binary -r requirements.txt -d build/wheelhouse
      - name: Prepare embedded runtime
        run: python scripts/prepare_windows_runtime.py --wheelhouse build/wheelhouse
      - name: Build portable zip
        run: python scripts/build_portable.py --runtime-dir build/windows-runtime --output dist --target-platform windows
      - name: Cold-start portable zip
        run: python scripts/smoke_test_portable.py dist/Mu-4.3.0-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Mu-Windows-portable
          path: |
            dist/*.zip
            dist/*.sha256
